name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir site
          cp app/index.html app/manifest.json app/sw.js site/
          [ -f app/extras.js ] && cp app/extras.js site/
          [ -f app/embeddings.json ] && cp app/embeddings.json site/
          [ -f app/pf-data.json ] && cp app/pf-data.json site/
          for f in icon-180 icon-192 icon-512 icon-512-maskable favicon logo; do
            base64 -d app/$f.png.b64 > site/$f.png
          done
          base64 -d app/favicon.ico.b64 > site/favicon.ico
          if [ -f app/assets.tar.gz.b64 ]; then
            base64 -d app/assets.tar.gz.b64 | tar -xz -C site
          elif ls app/assets.tar.gz.b64.p* >/dev/null 2>&1; then
            cat app/assets.tar.gz.b64.p* | base64 -d | tar -xz -C site
          elif [ -f app/assets.tar.b64 ]; then
            base64 -d app/assets.tar.b64 | tar -x -C site
          fi
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - name: Push to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Try to enable Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || gh api "repos/${GITHUB_REPOSITORY}/pages"
